# OurHomeInbox. Reads its two settings files from the repo root:
#   .env        secrets, passed in as environment variables
#   config.yml  everything else, mounted read-only
#
# Mail is read over IMAP from the server set in config.yml. For Proton Mail
# that is a Proton Mail Bridge container on the same Docker network, which
# must be running first.
#
# Easiest: ./docker/deploy.sh. It creates both settings files on the first
# run, walks through them, builds, and runs. It also hands config.yml's
# docker: section (the network name) to compose through docker/.compose.env.
#
# By hand, from the repo root:
#   copy .env.example to .env and config.example.yml to config.yml, fill them in
#   docker network create ourhome_net        # skip if it already exists
#   docker compose -f docker/docker-compose.yml up --build
# (the network is then always ourhome_net)
#
# For now it reads each mailbox once, captures new messages into the repo's
# data/ folder, and exits, so it does not restart on its own.

name: ourhome-inbox

services:
  ourhome-inbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ourhome/ourhome-inbox:dev
    container_name: ourhome_inbox
    restart: "no"
    # Runs as you (deploy.sh fills these in on Linux) so the captured mail in
    # data/ belongs to you. Docker Desktop on Windows and macOS ignores this.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    env_file:
      # raw: values are passed exactly as written. Without it, compose reads
      # a "$" in a password as a variable and silently changes the password.
      - path: ../.env
        required: true
        format: raw
    volumes:
      # Long form so a missing config.yml is an error. The short form would
      # quietly create an empty folder called config.yml instead.
      - type: bind
        source: ../config.yml
        target: /app/config.yml
        read_only: true
        bind:
          create_host_path: false
      # Captured mail: raw emails, attachments and what was read from them.
      # Real, private mail; the repo's .gitignore keeps it out of git.
      - type: bind
        source: ../data
        target: /app/data
    # host.docker.internal = the computer running Docker (for a Bridge app or
    # mail server on it). Docker Desktop has it built in; this adds it on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ourhome

networks:
  ourhome:
    name: ${DOCKER_NETWORK:-ourhome_net}
    external: true
