# OurHomeInbox. Reads its two settings files from the repo root:
#   .env secrets, passed in as environment variables (a changed one
#               takes effect when deploy.sh runs the container again)
#   config.yml the install's settings, mounted writable: the web page's
#               Settings save the reading schedule and log level into it
#               (keeping its comments) and use them at once
#
# Mail is read over IMAP from the server set in config.yml. For Proton Mail
# that is a Proton Mail Bridge container on the same Docker network, which
# must be running first.
#
# Easiest: ./docker/deploy.sh. It creates both settings files on the first
# run, walks through them, builds, starts OurHomeInbox and waits until the web
# page answers. It also hands config.yml's docker: section (network, port,
# who can reach it) and web.port to compose through docker/.compose.env.
#
# By hand, from the repo root:
#   copy .env.example to .env and config.example.yml to config.yml, fill them in
#   docker network create ourhome_net # skip if it already exists
#   docker compose -f docker/docker-compose.yml up -d --build
# (then always ourhome_net, and the web page on http://127.0.0.1:8080)
#
# It runs until stopped: the web page and API, and every mailbox read every
# capture.every_minutes. Captured mail and accounts live in the repo's data/.

name: ourhome-inbox

services:
  ourhome-inbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ourhome/ourhome-inbox:dev
    container_name: ourhome_inbox
    restart: unless-stopped
    # The web page. DOCKER_BIND decides who can open it: 127.0.0.1 is this
    # computer only, 0.0.0.0 your whole network.
    ports:
      - "${DOCKER_BIND:-127.0.0.1}:${DOCKER_PORT:-8080}:${WEB_PORT:-8080}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${WEB_PORT:-8080}/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Runs as you (deploy.sh fills these in on Linux), so the captured mail in
    # data/ belongs to you. Docker Desktop on Windows and macOS ignores this.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    env_file:
      # raw: values are passed exactly as written. Without it, compose reads
      # a "$" in a password as a variable and silently changes the password.
      # Needs Docker Compose 2.30 or newer. Some editors (PyCharm) flag
      # "format" as unexpected because their built-in schema is older; the
      # line is correct.
      - path: ../.env
        required: true
        format: raw
    volumes:
      # Long form so a missing config.yml is an error. The short form would
      # quietly create an empty folder called config.yml instead. Writable for
      # the web page's Settings; the old file is copied to data/config.yml.bak
      # before each change.
      - type: bind
        source: ../config.yml
        target: /app/config.yml
        read_only: false
        bind:
          create_host_path: false
      # Captured mail (raw emails, attachments, what was read from them), the
      # database (accounts, billers, mailboxes with their passwords encrypted)
      # and config.yml's backup. Real, private data; .gitignore keeps it out of git.
      - type: bind
        source: ../data
        target: /app/data
    # host.docker.internal = the computer running Docker (for a Bridge app or
    # mail server on it). Docker Desktop has it built in; this adds it on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ourhome

networks:
  ourhome:
    name: ${DOCKER_NETWORK:-ourhome_net}
    external: true
